<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CreativeOps · NTV360 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--g:linear-gradient(90deg,#a50a5a,#e8342a,#f7931e);--ac:#C41E5C;--tint:#fde8ef;--bg:#f7f6f9;--ink:#1d1a2b;--mut:#6b6880;--line:#ece9f1;--sh:0 2px 10px rgba(60,20,50,.07);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#f7f6f9}
html.login{background:#d12a55}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f6f9;color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.hide{display:none!important}

/* buttons & form */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;transition:background .15s,box-shadow .15s}
.btn:hover{background:#faf7fa}
.btn-g{background:var(--g);color:#fff;border:0;box-shadow:0 4px 12px rgba(232,52,42,.25)}
.btn-g:hover{background:var(--g);filter:brightness(1.06)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.5;cursor:not-allowed}
.inp,.sel{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px}
.sel{width:auto;padding-right:8px}
label.lb{display:block;font-weight:700;font-size:12px;margin:12px 0 5px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--tint);color:var(--ac)}
.pill.n{background:#eeecf3;color:#555069}
.pill.ok{background:#e3f6ea;color:#1b7a43}
.pill.w{background:#fff1dc;color:#a35d00}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.muted{color:var(--mut)}
.err{color:#c4161c;font-size:12px;margin-top:6px;font-weight:600}

/* logo */
.nlogo{display:inline-flex;align-items:flex-end;gap:2px;line-height:1}
.nlogo b{font-style:italic;font-weight:800;letter-spacing:-.04em;background:linear-gradient(90deg,#e8342a,#f7931e);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:40px}
.nlogo i{font-style:normal;font-weight:800;color:#f7931e;font-size:12px;margin-bottom:5px}

/* login */
.lg-wrap{min-height:100vh;background:linear-gradient(180deg,#d12a55 0%,#e8342a 55%,#f0481f 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.lg-wrap::before,.lg-wrap::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.lg-wrap::before{width:360px;height:360px;right:-90px;top:-110px}
.lg-wrap::after{width:300px;height:300px;left:-110px;bottom:-90px}
.lg-in{position:relative;z-index:1;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:860px;width:100%}
.lg-card{background:#fff;border-radius:12px;padding:30px 24px 28px;width:100%;max-width:410px;box-shadow:0 10px 40px rgba(80,0,30,.25)}
.lg-card h1{text-align:center;font-size:22px;margin-top:26px}
.lg-card .sub{text-align:center;color:var(--mut);font-size:13px;margin:4px 0 22px}
.lg-card .inp{background:#f6f7f8}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;font-size:12px;font-weight:700;color:var(--mut)}
.lg-demo{width:270px;flex:1 1 260px;max-width:340px}
.lg-demo>p{color:#fff;font-weight:700;font-size:13px;margin:2px 0 8px}
.dcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fde8ef;border:0;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 6px 20px rgba(80,0,30,.18);transition:transform .15s}
.dcard:nth-of-type(2){background:#fdeeea}
.dcard:hover{transform:translateY(-2px)}
.av{position:relative;width:64px;height:64px;flex:none}
.av svg{width:64px;height:64px;border-radius:50%}
.av .rp{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--g);color:#fff;font-size:9px;font-weight:700;padding:2px 9px;border-radius:999px}
.dcard h3{font-size:14px}
.dcard p{font-size:11px;color:var(--mut);margin-top:2px}
.dcard .ar{margin-left:auto;width:28px;height:28px;border-radius:50%;background:#fbc4d3;color:var(--ac);display:grid;place-items:center;font-weight:800;flex:none}
.hint{margin-top:12px;font-size:11px;color:#fff;background:rgba(0,0,0,.18);border-radius:10px;padding:9px 11px;line-height:1.6}

/* app shell */
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:22px 12px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 10px 18px}
.brand b{font-size:17px;display:flex;align-items:center;gap:8px}
.brand b::before{content:"";width:12px;height:12px;background:var(--g);transform:rotate(45deg);border-radius:2px}
.blogo{display:block;width:176px;height:auto}
.brand small{display:block;margin:4px 0 0 4px;font-size:11px;color:var(--mut);letter-spacing:.03em}
.nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:#44415a;font-size:13.5px;white-space:nowrap}
.nv span{width:16px;color:#8d8aa0;text-align:center}
.nv:hover{background:#faf5f8}
.nv.on{background:var(--tint);color:var(--ac)}
.nv.on span{color:var(--ac)}
.sidebot{margin-top:auto;border-top:1px solid var(--line);padding:12px 4px 0}
.sidebot small{display:block;font-size:10.5px;color:var(--mut);margin-bottom:4px}
.sidebot .sel{width:100%}
.who{font-size:12px;margin:10px 0 6px;font-weight:600}
.logout{border:0;background:none;color:var(--ac);font-weight:700;font-size:12.5px;padding:4px 0}
.main{flex:1;min-width:0;padding:16px 24px 40px}
.banner{background:#fdeef3;color:#8f1a48;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:26px;letter-spacing:-.01em}
.ph p{color:var(--mut);margin-top:4px}
@media(max-width:860px){
 .app{flex-direction:column}
 .side{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:0 6px;flex:none}.brand small{display:none}.blogo{width:118px}
 .nav{flex-direction:row;flex:none}
 .sidebot{margin:0 0 0 auto;border:0;padding:0;display:flex;align-items:center;gap:10px;flex:none}
 .sidebot small,.who{display:none}
 .main{padding:12px 14px 40px}
}

/* generic pages */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px}
.stat b{font-size:28px;display:block;letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.tbl th{font-size:12px;color:var(--mut);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.flow .card{padding:16px}

/* library */
.lib{display:flex;gap:16px;align-items:flex-start}
.cats{width:230px;flex:none;padding:12px 8px}
.ct{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;font-size:13.5px;color:#34314a}
.ct em{font-style:normal;color:var(--mut)}
.ct:hover{background:#faf5f8}
.ct.on{background:var(--tint);color:var(--ac);font-weight:700}
.ct.on em{color:var(--ac)}
.cats hr{border:0;border-top:1px solid var(--line);margin:10px 8px}
.cats .hd{font-size:11px;color:var(--mut);padding:4px 12px;letter-spacing:.04em}
.sp{padding-left:12px}
.sp .ct{font-size:13px}
.subs{margin:2px 0 4px 22px;border-left:1px solid var(--line)}
.subs .ct{padding:7px 12px;font-size:12.5px}
.libmain{flex:1;min-width:0}
.crumb{color:var(--mut);font-size:13px;margin-bottom:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools .inp{width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ac{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh);text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.ac:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,20,50,.12)}
.th{height:104px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}
.ac .bd{padding:11px 12px 12px}
.ac b{display:block;font-size:13px}
.ac span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;text-align:left}
.lrow .th{width:84px;height:54px;border-radius:8px;flex:none;font-size:11px}
.lrow .t{flex:1;min-width:0}
.lrow b{font-size:13px;display:block}.lrow span{font-size:12px;color:var(--mut)}
.empty{text-align:center;padding:50px 20px;background:#fff;border:1px dashed #dcd6e3;border-radius:16px}
.empty h3{font-size:16px;margin-bottom:6px}
@media(max-width:860px){.lib{flex-direction:column}.cats{width:100%}.tools .inp{width:100%}}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(25,12,30,.5);display:grid;place-items:center;padding:16px;z-index:100}
.md{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md h2{font-size:18px;margin-bottom:12px}
.md .big{height:230px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;position:relative;overflow:hidden;margin-bottom:14px}
.md .big.mp::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);animation:shine 2.4s linear infinite}
.md .big.stop::after{animation-play-state:paused}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prog{height:5px;background:#eee;border-radius:9px;overflow:hidden;margin:-4px 0 14px}
.prog i{display:block;height:100%;background:var(--g);width:0;animation:prog 6s linear infinite}
.prog.stop i{animation-play-state:paused}
@keyframes prog{to{width:100%}}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 14px;font-size:13px}
dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;font-weight:600}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a1f33;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}

/* embedded sponsorship mini library */
.emb{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.etop{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.etop b{font-size:14px}
.etop .inp{flex:1;min-width:160px;max-width:340px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfafc}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:12.5px;white-space:nowrap;color:#44415a}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.chip.sm{padding:5px 10px;font-size:12px}
.ebody{padding:18px;background:#faf9fc}
.hero{border-radius:16px;background:var(--g);color:#fff;padding:30px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.15)}
.hero h2{font-size:clamp(22px,3.4vw,32px);letter-spacing:-.02em;max-width:420px}
.hero p{margin:8px 0 16px;max-width:420px;opacity:.95}
.hero .btn{background:#fff;color:var(--ac);border:0;position:relative;z-index:1}
.sec{margin-bottom:24px}
.sec>h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px}
.row .tc{flex:0 0 280px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;text-align:left;padding:0}
.tc .scr{border-radius:0;cursor:pointer}
.tc .bd{padding:12px;display:flex;flex-direction:column;gap:7px;flex:1}
.tc .id{font-size:11px;color:var(--mut);font-weight:700}
.tc h4{font-size:14.5px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tc .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cbox{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left}
.cbox b{display:block}.cbox span{font-size:12px;color:var(--mut)}
.cbox:hover{border-color:#f3a9bf}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .grp{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.filters small{font-weight:700;color:var(--mut);margin-right:2px}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media(max-width:980px){.detail{grid-template-columns:1fr}}
.player{background:#14111c;border-radius:16px;padding:12px}
.pwrap{margin:0 auto}
.pwrap.l{width:100%}.pwrap.p{width:min(100%,260px)}
.pctl{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
.pctl .btn{background:#2a2535;color:#fff;border-color:#3b3548}
.pctl .btn.on{background:var(--g);border:0}
.note{font-size:12px;color:var(--mut)}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.split{grid-template-columns:1fr}}
.sel-row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.sel-row .scr{width:150px;flex:none}
.cust{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media(max-width:980px){.cust{grid-template-columns:1fr}}
.cols{display:flex;gap:10px}
.cols>div{flex:1}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff}
.assist{background:#fff7ec;border:1px solid #f9d9a8;border-radius:12px;padding:12px;margin-top:14px}
.assist li{margin:3px 0}
.ok-box{text-align:center;padding:40px 20px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.ok-box .tick{width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 12px}

/* ===== signage screens (simulated, CSS animation) ===== */
.scr{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:12px;--u:1cqw;background:#222;color:#fff;isolation:isolate}
.scr.p{aspect-ratio:9/16;--u:1.8cqw}
.scr.paused *,.scr.paused *::before,.scr.paused *::after{animation-play-state:paused!important}
.sc{position:absolute;inset:0;overflow:hidden}
.o{display:flex}.o>.oi{flex:1}
.li2{--dc:#d6a84a}.li3{--dc:#111}
.scr .fx{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*4)}
.pop{animation:pop 8s infinite both}
@keyframes pop{0%{opacity:0;transform:translateY(calc(var(--u)*3))}12%,90%{opacity:1;transform:none}98%,100%{opacity:0}}
.pop.d1{animation-delay:.25s}.pop.d2{animation-delay:.5s}.pop.d3{animation-delay:.75s}.pop.d4{animation-delay:1s}
@keyframes okk{0%,58%{transform:none;filter:none}66%,92%{transform:scale(1.07)}100%{transform:none}}
@keyframes nok{0%,58%{opacity:1}66%,92%{opacity:.28}100%{opacity:1}}
.oi.ok{animation:okk 8s infinite}
.oi.no{animation:nok 8s infinite}
.qa5 .oi.ok{animation:none}.qa5 .oi.no{animation:none;opacity:.55}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-1.4))}}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.cd{height:1em;line-height:1em;overflow:hidden;font-weight:800;display:inline-block;min-width:.6em;text-align:center}
.cd div{height:1em;line-height:1em;animation:cdstep 5s steps(5) infinite}
@keyframes cdstep{to{transform:translateY(-5em)}}

/* QA-001 clean cards */
.qa1{background:var(--c2,#f6f7fb);color:#1c2540}
.qa1 .fx{justify-content:center;gap:calc(var(--u)*3)}
.qa1 .k{font-size:calc(var(--u)*1.7);font-weight:700;color:var(--c1,#C41E5C)}
.qa1 .q{font-size:calc(var(--u)*4.4);font-weight:800;line-height:1.15;max-width:90%}
.qa1 .opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6)}
.scr.p .qa1 .opts{grid-template-columns:1fr}
.qa1 .oi{background:#fff;border:calc(var(--u)*.25) solid #dfe3ef;border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.7);font-weight:700;font-size:calc(var(--u)*2.5);display:flex;gap:calc(var(--u)*1.4);align-items:center}
.qa1 .oi i{font-style:normal;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#eceff7;display:grid;place-items:center;font-size:calc(var(--u)*1.8);flex:none}
.qa1 .oi.ok{border-color:var(--c1,#C41E5C);background:#fff3f7}
.qa1 .oi.ok i{background:var(--c1,#C41E5C);color:#fff}
/* QA-002 pop quiz */
.qa2{background:linear-gradient(135deg,var(--c1,#7b2ff7),var(--c2,#f107a3))}
.qa2 .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);animation:bob 4s ease-in-out infinite}
.qa2 .fx{align-items:center;text-align:center;gap:calc(var(--u)*2.6)}
.qa2 .q{background:#fff;color:#3a1259;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.2) calc(var(--u)*3);font-size:calc(var(--u)*3.6);font-weight:800;box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.18);max-width:92%}
.qa2 .opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6);width:100%}
.scr.p .qa2 .opts{grid-template-columns:1fr}
.qa2 .oi{border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*2);font-weight:800;font-size:calc(var(--u)*2.6);color:#2a1040;display:flex;align-items:center;gap:calc(var(--u)*1.4);box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.2)}
.qa2 .oi i{font-style:normal;background:#fff;border-radius:50%;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);display:grid;place-items:center;font-size:calc(var(--u)*1.9)}

}

function pageView(){
  switch(STATE.page){
    case "dashboard":return dashboard();
    case "requests":return requests();
    case "franchisees":return franchisees();
    case "settings":return settings();
    default:return library();
  }
}
const head=(t,s,extra="")=>`<div class="ph"><div><h1>${t}</h1><p>${s}</p></div>${extra}</div>`;
const SAMPLE=`<span class="pill n">Sample data</span>`;
function dashboard(){
  return head("Dashboard",`Overview of creative work. ${SAMPLE}`)+`
  <div class="stats">${[["Open requests","12"],["In QC review","4"],["Delivered this week","9"],["Library assets",STATE.assets.length+SPONSOR_COUNT]].map(s=>`<div class="card stat"><span class="muted">${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>
  <div class="card"><div style="padding:14px 16px;font-weight:700">Recent activity</div><div class="tw"><table class="tbl"><tbody>
  ${[["Basketball Tips #2 added to Channel","Jane Doe","Oct 13"],["Menu Board: Lunch Combos approved","John Doe","Oct 12"],["Request #1042 moved to QC","Jane Doe","Oct 12"],["Sponsorship templates refreshed","NCTV360","Oct 10"]].map(r=>`<tr><td>${r[0]}</td><td class="muted">${r[1]}</td><td class="muted">${r[2]}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function requests(){
  const rows=[["#1042","Grand opening promo screen","Franchise 014","In QC","Oct 14"],["#1041","Weekend deals loop","Franchise 007","Design","Oct 15"],["#1039","Breakfast menu board refresh","Franchise 021","Delivered","Oct 11"],["#1038","Volleyball trivia pack","Channel","Design","Oct 16"],["#1036","Sponsor banner: local gym","Franchise 003","Intake","Oct 18"],["#1033","Holiday greeting static","Franchise 011","Delivered","Oct 9"]];
  const cls={Intake:"n","In QC":"w",Design:"",Delivered:"ok"};

function franchisees(){

/* ---------- Mini-Library ---------- */
function visibleAssets(){
  const L=STATE.lib;let list=STATE.assets.filter(a=>a.cat===L.cat);
  if(L.cat==="Channel"){if(L.sport)list=list.filter(a=>a.sport===L.sport);if(L.sub)list=list.filter(a=>a.sub===L.sub);}
  if(L.type!=="All")list=list.filter(a=>a.ext===L.type);

  return `<div class="hero"><h2>Your Screens. More Possibilities.</h2><p>Quiz, logo, ad and sponsor templates for your digital signage, included with your subscription.</p><button class="btn" data-a="sGo" data-v="qa">Browse Q&A templates</button></div>
  ${rowOf("Featured",TPL.filter(t=>t.feat).map(t=>t.id))}
  ${rowOf("New This Month",TPL.filter(t=>t.isnew).map(t=>t.id))}
  <section class="sec"><h3>Browse by Category</h3><div class="cgrid">${Object.keys(CATN).map(k=>`<button class="cbox" data-a="sGo" data-v="${k}"><b>${CATN[k]}</b><span>${TPL.filter(t=>t.cat===k).length} templates</span></button>`).join("")}</div></section>
  ${rowOf("Popular Templates",byPop)}
  ${rowOf("Recently Added",rec)}`;
}
function sRecent(){return `<h2 style="margin-bottom:12px;font-size:20px">Recently Added</h2><div class="tgrid">${[...TPL].sort((a,b)=>b.added-a.added).map(tCard).join("")}</div>`;}
function sSearch(){
  const q=S.q.trim().toLowerCase();
  const r=TPL.filter(t=>(t.id+" "+t.n+" "+t.style+" "+CATN[t.cat]+" "+t.desc).toLowerCase().includes(q));
  return `<h2 style="margin-bottom:12px;font-size:20px">Search results for “${esc(S.q)}”</h2>${r.length?`<div class="tgrid">${r.map(tCard).join("")}</div>`:`<div class="empty"><h3>No templates found</h3><p class="muted" style="margin-bottom:12px">Try a style such as Playful, or an ID like QA-003.</p><button class="btn" data-a="sClearQ">Clear search</button></div>`}`;
}
function sCat(){
  const all=TPL.filter(t=>t.cat===S.cat);
  const styles=["All",...new Set(all.map(t=>t.style))];
  const F=S.f;
  const list=all.filter(t=>(F.style==="All"||t.style===F.style)&&(F.o==="Any"||t.o.includes(F.o))&&(F.m==="Any"||t.motion===F.m));
  const grp=(label,key,vals)=>`<div class="grp"><small>${label}</small>${vals.map(v=>`<button class="chip sm ${F[key]===v?"on":""}" data-a="sFilter" data-v="${key}" data-v2="${v}">${v==="All"?"All Styles":v}</button>`).join("")}</div>`;
  return `<h2 style="font-size:22px;margin-bottom:4px">${CATN[S.cat]}</h2><p class="muted" style="margin-bottom:14px">${all.length} templates${S.cat==="qa"?". Our most detailed category.":""}</p>
  <div class="filters">${S.cat!=="qt"||styles.length>2?grp("Style","style",styles):""}${grp("Orientation","o",["Any","16:9","9:16"])}${grp("Motion","m",["Any","Static","Animated"])}</div>
  ${list.length?`<div class="tgrid">${list.map(tCard).join("")}</div>`:`<div class="empty"><h3>No templates match these filters</h3><p class="muted" style="margin-bottom:12px">Loosen a filter to see more.</p><button class="btn" data-a="sResetF">Reset filters</button></div>`}`;
}
function editable(t){
  const base=["Question and answer text"];
  if(t.cat!=="qa")base.length=0;
  if(t.type==="Ready-Made")return t.cat==="qa"?base:["Nothing. This template is used as it is"];
  return ["Logo","Two brand colours",...(t.cat==="qa"?["Question and answer text","Timer style"]:[]),...(t.cat==="sp"?["Sponsor wording"]:[])];
}
function assets(t){return t.cat==="qa"?"Question list; logo (PNG or SVG) if branded":t.cat==="sp"?"Sponsor logo (PNG or SVG) and name":t.cat==="li"?"Logo (PNG or SVG)":t.cat==="ad"?"Logo and product or service details":"None";}
function sDetail(){
  const t=tpl(S.tid),c=S.cfg,p=S.orient==="9:16";
  const similar=TPL.filter(x=>x.cat===t.cat&&x.id!==t.id).slice(0,3);
  const isSel=sel(t.id);
  return `<button class="btn btn-sm" data-a="sGo" data-v="${t.cat}" style="margin-bottom:12px">← ${CATN[t.cat]}</button>
  <div class="detail"><div><div class="player"><div class="pwrap ${p?"p":"l"}" id="pwrap">${preview(t,c,{p,paused:!S.playing,timer:t.cat==="qa"?c.timer:null})}</div>
   <div class="pctl"><button class="btn on" data-a="play" id="playbtn">${S.playing?"Pause":"Play"}</button>
   ${["16:9","9:16"].map(o=>t.o.includes(o)?`<button class="btn ${S.orient===o?"on":""}" data-a="orient" data-v="${o}">${o==="16:9"?"Landscape 16:9":"Portrait 9:16"}</button>`:`<button class="btn off" disabled title="Not supported by this template">${o==="16:9"?"Landscape 16:9":"Portrait 9:16"}</button>`).join("")}</div>
   <p class="note" style="text-align:center;margin-top:8px;color:#a9a4b8">Simulated preview${t.cat==="qa"?" of a question, then the answer reveal":""}. Looped CSS animation.</p></div>
   ${t.cat==="sp"?`<div class="box" style="margin-top:14px"><b>Wording</b><div class="tags" style="margin-top:8px">${WORDS.map(w=>`<button class="chip sm ${c.word===w?"on":""}" data-a="word" data-v="${w}">${w}</button>`).join("")}</div></div>`:""}
   ${t.cat==="qa"?`<div class="box" style="margin-top:14px"><b>Available timer styles</b><div class="tags" style="margin-top:8px">${TPL.filter(x=>x.cat==="qt").map(x=>`<button class="chip sm ${c.timer===x.id?"on":""}" data-a="timer" data-v="${x.id}">${x.n}</button>`).join("")}</div></div>
   <div class="box" style="margin-top:14px"><b>Recommended question packs</b><p class="note" style="margin:2px 0 8px">Tap a pack to load its sample question into the preview.</p><div class="tags">${Object.keys(PACKS).map(k=>`<button class="chip sm" data-a="pack" data-v="${esc(k)}">${k}</button>`).join("")}</div></div>`:""}
  </div>
  <div><div class="id muted" style="font-weight:700">${t.id}</div><h2 style="font-size:24px;margin:2px 0 6px">${esc(t.n)}</h2><p class="muted" style="margin-bottom:12px">${esc(t.desc)}</p>
   <div class="tags" style="margin-bottom:14px"><span class="pill ${t.sub==="Included"?"ok":"w"}">${t.sub==="Included"?"Included in subscription":"Premium add-on"}</span><span class="pill">${t.type}</span></div>
   <dl class="kv"><dt>Visual style</dt><dd>${t.style}</dd><dt>Motion</dt><dd>${t.motion}</dd><dt>Orientations</dt><dd>${t.o.join(" and ")}</dd><dt>Duration</dt><dd>${t.dur}</dd><dt>You can edit</dt><dd>${editable(t).join(", ")}</dd><dt>Required assets</dt><dd>${assets(t)}</dd></dl>
   ${t.type==="Assisted-Customization"?`<div class="assist"><b>Assisted customization</b><p class="note" style="margin-top:4px">NCTV360 finishes the final design for you after you submit a request.</p></div>`:""}
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">${isSel?`<button class="btn off" disabled>Selected ✓</button>`:`<button class="btn btn-g" data-a="select" data-v="${t.id}">Select This Template</button>`}<button class="btn ${isSel?"btn-g":""}" data-a="custom" data-v="${t.id}">Customize</button></div>
   ${similar.length?`<h4 style="margin:22px 0 8px">Similar templates</h4><div style="display:grid;gap:10px">${similar.map(s=>`<button class="sel-row" data-a="sOpen" data-v="${s.id}" style="text-align:left;margin:0"><div style="width:110px;flex:none;pointer-events:none">${preview(s,DEF,{})}</div><div><b>${esc(s.n)}</b><div class="note">${s.id} · ${s.style}</div></div></button>`).join("")}</div>`:""}
  </div></div>`;
}
function sCustom(){
  const t=tpl(S.tid),c=S.cfg,ready=t.type==="Ready-Made",p=S.orient==="9:16",qa=t.cat==="qa";
  const dis=ready?"disabled":"";
  return `<button class="btn btn-sm" data-a="sOpen" data-v="${t.id}" style="margin-bottom:12px">← Back to ${esc(t.n)}</button>
  <h2 style="font-size:22px;margin-bottom:2px">Customize ${esc(t.n)}</h2><p class="muted" style="margin-bottom:14px">${t.id} · <span class="pill">${t.type}</span></p>
  <div class="cust"><div>
   <div class="box"><b>What you can edit</b>
    ${ready?`<p class="note" style="margin-top:6px">This template is Ready-Made, so ${qa?"only the question text can be changed":"it is used exactly as shown"}.</p>`:""}
    <label class="lb">Logo ${ready?"":`<span class="muted" style="font-weight:500">(simulated upload, stays in your browser)</span>`}</label>
    <input type="file" accept="image/*" data-i="logo" ${dis} aria-label="Upload logo"><p class="note" id="logoname">${c.logoName?"Selected: "+esc(c.logoName):"No logo chosen. A placeholder is shown."}</p>
    <label class="lb" for="cf-brand">Brand name</label><input class="inp" id="cf-brand" data-i="brand" value="${esc(c.brand)}" ${dis}>
    <div class="cols"><div><label class="lb" for="cf-c1">Colour 1</label><input type="color" id="cf-c1" data-i="c1" value="${c.c1}" ${dis}></div><div><label class="lb" for="cf-c2">Colour 2</label><input type="color" id="cf-c2" data-i="c2" value="${c.c2}" ${dis}></div></div>
    ${qa?`<label class="lb" for="cf-q">Question</label><input class="inp" id="cf-q" data-i="q" value="${esc(c.q)}"><div class="cols"><div><label class="lb" for="cf-ans">Correct answer</label><input class="inp" id="cf-ans" data-i="ans" value="${esc(c.ans)}"></div></div><div class="cols"><div><label class="lb" for="cf-w1">Other answer</label><input class="inp" id="cf-w1" data-i="w1" value="${esc(c.w1)}"></div><div><label class="lb" for="cf-w2">Other answer</label><input class="inp" id="cf-w2" data-i="w2" value="${esc(c.w2)}"></div><div><label class="lb" for="cf-w3">Other answer</label><input class="inp" id="cf-w3" data-i="w3" value="${esc(c.w3)}"></div></div>
     <label class="lb" for="cf-timer">Timer</label><select class="sel" id="cf-timer" data-i="timer" style="width:100%">${TPL.filter(x=>x.cat==="qt").map(x=>`<option value="${x.id}" ${c.timer===x.id?"selected":""}>${x.id} ${x.n}</option>`).join("")}</select>`:""}
    ${t.cat==="sp"?`<label class="lb" for="cf-word">Sponsor wording</label><select class="sel" id="cf-word" data-i="word" style="width:100%">${WORDS.map(w=>`<option ${c.word===w?"selected":""}>${w}</option>`).join("")}</select>`:""}
    <label class="lb">Orientation</label><div class="tags">${["16:9","9:16"].map(o=>t.o.includes(o)?`<button class="chip sm ${S.orient===o?"on":""}" data-a="orient" data-v="${o}" data-keep="1">${o}</button>`:`<button class="chip sm" disabled title="Not supported">${o}</button>`).join("")}</div>
   </div>
   <div class="assist"><b>Needs NCTV360 assistance</b><ul style="margin:6px 0 0;padding-left:18px" class="note"><li>Custom fonts and typography</li><li>Your own background footage or photos</li><li>New animation timing or transitions</li><li>Bilingual or multi-language layouts</li><li>Sound or music</li></ul>${t.type==="Assisted-Customization"?`<p class="note" style="margin-top:6px"><b>This template is Assisted-Customization:</b> NCTV360 finalises it for you.</p>`:""}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-g" data-a="addSel" data-v="${t.id}">Add to My Selections</button><button class="btn" data-a="resetCfg">Reset to defaults</button></div>
  </div>
  <div class="player" style="position:sticky;top:8px"><div class="pwrap ${p?"p":"l"}" id="prev">${preview(t,c,{p,paused:!S.playing,timer:qa?c.timer:null})}</div><div class="pctl"><button class="btn on" data-a="play" id="playbtn">${S.playing?"Pause":"Play"}</button></div><p class="note" style="text-align:center;margin-top:8px;color:#a9a4b8">Live simulated preview</p></div></div>`;
}
function sSel(){
  if(!S.sel.length)return `<div class="empty"><h3>No selections yet</h3><p class="muted" style="margin-bottom:12px">Pick templates you like, then submit them as one request.</p><button class="btn btn-g" data-a="sGo" data-v="home">Discover templates</button></div>`;
  const assisted=S.sel.filter(i=>tpl(i).type==="Assisted-Customization").length;
  return `<h2 style="font-size:22px;margin-bottom:12px">My Selections</h2>
  ${S.sel.map(i=>{const t=tpl(i);return `<div class="sel-row"><div style="width:150px;flex:none">${preview(t,DEF,{})}</div><div style="flex:1;min-width:150px"><div class="id muted" style="font-weight:700">${t.id}</div><b>${esc(t.n)}</b><div class="tags" style="margin-top:4px"><span class="pill">${t.type}</span><span class="pill ${t.sub==="Included"?"ok":"w"}">${t.sub==="Included"?"Included":"Premium add-on"}</span></div></div><button class="btn btn-sm" data-a="custom" data-v="${t.id}">Customize</button><button class="btn btn-sm" data-a="rmSel" data-v="${t.id}">Remove</button></div>`;}).join("")}
  ${assisted?`<div class="assist"><b>${assisted} template${assisted>1?"s need":" needs"} NCTV360 assistance</b><p class="note">We will contact you to finish ${assisted>1?"them":"it"}.</p></div>`:""}
  <label class="lb" for="sn" style="margin-top:14px">Notes for the NCTV360 team (optional)</label><textarea class="inp" id="sn" data-i="notes" rows="3" placeholder="Anything we should know?">${esc(S.notes)}</textarea>
  <div style="margin-top:14px"><button class="btn btn-g" data-a="submitReq">Submit request</button> <span class="note">Simulated. Nothing is sent.</span></div>`;
}
/* ---------- render & events ---------- */
function render(top){
  const a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd,y=window.scrollY;
  document.documentElement.className=STATE.view==="login"?"login":"";
  $("#root").innerHTML=STATE.view==="login"?loginView():shell()+modalView();
  if(id){const n=document.getElementById(id);if(n&&(n.tagName==="INPUT"||n.tagName==="TEXTAREA")&&n.type!=="file"&&n.type!=="color"){n.focus();try{if(ss!=null)n.setSelectionRange(ss,se);}catch(e){}}}
  window.scrollTo(0,top?0:y);
}
function doLogin(role){STATE.view="app";STATE.role=role;STATE.page="library";STATE.loginErr="";render(true);}
function updatePrev(){const t=tpl(S.tid),n=$("#prev");if(!t||!n)return;n.innerHTML=preview(t,S.cfg,{p:S.orient==="9:16",paused:!S.playing,timer:t.cat==="qa"?S.cfg.timer:null});}
function setTid(id){const t=tpl(id);if(S.tid!==id)S.cfg.cu=false;S.tid=id;S.orient=t.o.includes(S.orient)?S.orient:t.o[0];S.playing=true;}
function selAdd(id){if(!S.sel.includes(id))S.sel.push(id);}

const ACT={
 togglePw(){STATE.showPw=!STATE.showPw;const i=$("#lpw");i.type=STATE.showPw?"text":"password";$("[data-a=togglePw]").textContent=STATE.showPw?"Hide":"Show";},
 forgot(){toast("Password reset isn’t available in this prototype.");},
 demo(v){doLogin(v.v);},
 logout(){STATE.view="login";STATE.modal=null;render(true);},
 nav(v){STATE.page=v.v;STATE.modal=null;render(true);},
 cat(v){const L=STATE.lib;L.cat=v.v;L.sport=null;L.sub=null;L.q="";L.type="All";render();},
 sport(v){const L=STATE.lib,s=v.v,same=L.cat==="Channel"&&L.sport===s&&!L.sub;L.cat="Channel";L.sport=s;L.sub=null;L.open[s]=same?!L.open[s]:true;L.q="";render();},
 sub(v){const L=STATE.lib;L.cat="Channel";L.sport=v.v;L.sub=v.v2;L.open[v.v]=true;L.q="";render();},
 mode(){const L=STATE.lib;L.mode=L.mode==="grid"?"list":"grid";render();},
 clearFilters(){const L=STATE.lib;L.q="";L.type="All";render();},
 preview(v){STATE.modal={type:"preview",id:v.v};render();},
 closeModal(){STATE.modal=null;render();},
 pvplay(){const big=$("#pvbig"),pr=$("#pvprog"),b=$("#pvbtn"),stop=!big.classList.contains("stop");big.classList.toggle("stop",stop);pr&&pr.classList.toggle("stop",stop);b.textContent=stop?"Play preview":"Pause preview";},
 download(){toast("Download simulated. No file was saved.");},
 addAsset(){STATE.modal={type:"add"};render();setTimeout(()=>{const t=$("#af-title");t&&t.focus();},0);},
 addUnavail(){toast("Sponsorship templates are managed by NCTV360, so adding assets is unavailable here.");},
 saveAsset(){
  const title=$("#af-title").value.trim(),err=$("#af-err");
  if(!title){err.textContent="Enter a title for the asset.";err.hidden=false;return;}
  const L=STATE.lib,ext=$("#af-ext").value;let sport=null,sub=null;
  if(L.cat==="Channel"){sport=$("#af-sport").value;sub=$("#af-sub").value;L.sport=sport;L.sub=sub;L.open[sport]=true;}
  STATE.assets.push({id:uid++,title,cat:L.cat,sport,sub,ext,v:1,key:1027});
  L.q="";L.type="All";L.sort="new";STATE.modal=null;render();toast("Asset added (simulated upload, this session only).");
 },
 addSport(){STATE.modal={type:"sport"};render();setTimeout(()=>{const t=$("#sp-name");t&&t.focus();},0);},
 saveSport(){
  const n=$("#sp-name").value.trim(),err=$("#sp-err");
  const bad=!n?"Enter a sport name.":n.length>30?"Keep the name under 30 characters.":STATE.sports.some(s=>s.toLowerCase()===n.toLowerCase())?"That sport already exists.":"";
  if(bad){err.textContent=bad;err.hidden=false;return;}
  STATE.sports.push(n);const L=STATE.lib;L.cat="Channel";L.sport=n;L.sub=null;L.open[n]=true;STATE.modal=null;render();toast(`${n} added with 4 subcategories.`);
 },
 /* sponsorship */
 sGo(v){const k=v.v;S.q="";if(CATN[k]){S.page="cat";S.cat=k;S.f={style:"All",o:"Any",m:"Any"};}else S.page=k;render();},
 sOpen(v){setTid(v.v);S.page="detail";render();$(".emb")&&$(".emb").scrollIntoView({block:"start"});},
 sFilter(v){S.f[v.v]=v.v2;render();},
 sResetF(){S.f={style:"All",o:"Any",m:"Any"};render();},
 sClearQ(){S.q="";S.page="home";render();},
 play(){S.playing=!S.playing;document.querySelectorAll(".player .scr").forEach(n=>n.classList.toggle("paused",!S.playing));const b=$("#playbtn");b&&(b.textContent=S.playing?"Pause":"Play");},
 orient(v){S.orient=v.v;render();},
 word(v){S.cfg.word=v.v;render();},
 timer(v){S.cfg.timer=v.v;render();},
 pack(v){Object.assign(S.cfg,PACKS[v.v]);render();toast(`Loaded “${v.v}” sample question.`);},
 select(v){selAdd(v.v);render();toast("Added to My Selections.");},
 custom(v){setTid(v.v);S.page="custom";render(true);},
 addSel(v){selAdd(v.v);S.page="sel";render(true);toast("Added to My Selections.");},
 rmSel(v){S.sel=S.sel.filter(i=>i!==v.v);render();},
 resetCfg(){S.cfg={...DEF};render();},
 submitReq(){STATE.modal={type:"submitted",ref:"REQ-"+(1000+Math.floor(Math.random()*9000)),n:S.sel.length};S.sel=[];S.notes="";render();},
};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;
  if(a==="loginForm")return;
  if(a==="ovClose"){if(e.target===el)ACT.closeModal();return;}
  if(el.disabled)return;
  ACT[a]&&ACT[a]({v:el.dataset.v,v2:el.dataset.v2});
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-a=loginForm]");if(!f)return;e.preventDefault();
  const email=$("#lemail").value.trim().toLowerCase(),pw=$("#lpw").value,er=$("#lerr");
  const fail=m=>{er.textContent=m;};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return fail("Enter a valid email address, like name@company.com.");
  if(pw.length<6)return fail("Password must be at least 6 characters.");
  const role=email===PEOPLE.Admin.email?"Admin":email===PEOPLE.Designer.email?"Designer":null;
  if(!role||pw!==PW)return fail("Wrong email or password. Use one of the demo accounts shown on this page.");
  try{if($("#lrem").checked)localStorage.setItem("ntv_email",email);else localStorage.removeItem("ntv_email");}catch(x){}
  doLogin(role);
});
const CH_ONLY=new Set(["role","ltype","lsort","logo"]);
function onField(e){
  const el=e.target.closest("[data-i]");if(!el)return;const k=el.dataset.i,v=el.value,L=STATE.lib;
  if(CH_ONLY.has(k)&&e.type!=="change")return;
  switch(k){
   case "role":STATE.role=v;if(v==="Designer"&&["franchisees","settings"].includes(STATE.page))STATE.page="dashboard";render();toast(`Now viewing as ${PEOPLE[v].label}.`);break;
   case "lq":L.q=v;render();break;
   case "ltype":L.type=v;render();break;
   case "lsort":L.sort=v;render();break;
   case "sq":S.q=v;if(v.trim())S.page="search";else if(S.page==="search")S.page="home";render();break;
   case "notes":S.notes=v;break;
   case "c1":case "c2":S.cfg[k]=v;S.cfg.cu=true;updatePrev();break;
   case "logo":{const f=el.files&&el.files[0];if(!f)break;const r=new FileReader();r.onload=()=>{S.cfg.logo=r.result;S.cfg.logoName=f.name;const n=$("#logoname");n&&(n.textContent="Selected: "+f.name);updatePrev();};r.readAsDataURL(f);break;}
   case "timer":case "word":case "brand":case "q":case "ans":case "w1":case "w2":case "w3":S.cfg[k]=v;updatePrev();break;
  }
}
document.addEventListener("input",onField);document.addEventListener("change",onField);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&STATE.modal){ACT.closeModal();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button][data-a]")){e.preventDefault();e.target.click();}
});
render(true);

</script>
</body>
</html>
